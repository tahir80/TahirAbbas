<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>News — Tahir Abbas</title>
  <link rel="icon" href="assets/img/avatar-placeholder.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Tahir Abbas</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="publications.html">Publications</a>
        <a href="teaching.html">Teaching</a>
        <a href="news.html">News</a>
        <a href="awards.html">Awards &amp; Funding</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section style="padding-top:44px;">
      <span class="eyebrow">Updates</span>
      <h1 class="section-title">News</h1>
      <p class="section-sub">Recent updates, talks, and recognitions.</p>
      <div class="news-list" id="all-news-list"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; <span id="year"></span> Tahir Abbas</span>
      <span>Wageningen University &amp; Research</span>
    </div>
  </footer>

  <script src="assets/js/news-data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
    document.getElementById("all-news-list").innerHTML = NEWS.map(n => `
      <div class="news-item">
        <div class="news-date">${n.date}</div>
        <div class="news-body"><p>${n.text}</p></div>
      </div>`).join("");
  </script>
</body>
</html>
