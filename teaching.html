<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Teaching — Tahir Abbas</title>
  <link rel="icon" href="assets/img/avatar-placeholder.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <header class="site-header">
    <div class="header-inner">
      <a class="brand" href="index.html">Tahir Abbas</a>
      <nav class="main-nav">
        <a href="index.html">Home</a>
        <a href="publications.html">Publications</a>
        <a href="teaching.html">Teaching</a>
        <a href="news.html">News</a>
        <a href="awards.html">Awards &amp; Funding</a>
      </nav>
    </div>
  </header>

  <main class="wrap">
    <section style="padding-top:44px;">
      <span class="eyebrow">Teaching</span>
      <h1 class="section-title">Courses</h1>
      <p class="section-sub">Courses I teach at Wageningen University &amp; Research.</p>

      <h2 style="font-size:1.1rem; margin: 28px 0 14px;">Upcoming</h2>
      <div class="course-grid" id="upcoming-courses"></div>

      <h2 style="font-size:1.1rem; margin: 40px 0 14px;">Previously taught</h2>
      <div class="course-grid" id="taught-courses"></div>
    </section>
  </main>

  <footer class="site-footer">
    <div class="wrap">
      <span>&copy; <span id="year"></span> Tahir Abbas</span>
      <span>Wageningen University &amp; Research</span>
    </div>
  </footer>

  <script src="assets/js/courses-data.js"></script>
  <script src="assets/js/main.js"></script>
  <script>
    document.getElementById("year").textContent = new Date().getFullYear();

    function courseCardHTML(c) {
      const tag = c.status === "upcoming"
        ? '<span class="tag tag-upcoming">Upcoming</span>'
        : '<span class="tag tag-taught">Previously taught</span>';
      return `
        <div class="course-card">
          ${tag}
          <h3 class="course-title">${c.title}</h3>
          <p class="course-code">${c.code} &middot; ${c.period}</p>
        </div>`;
    }

    document.getElementById("upcoming-courses").innerHTML = COURSES
      .filter(c => c.status === "upcoming")
      .map(courseCardHTML)
      .join("");

    document.getElementById("taught-courses").innerHTML = COURSES
      .filter(c => c.status === "taught")
      .map(courseCardHTML)
      .join("");
  </script>
</body>
</html>
